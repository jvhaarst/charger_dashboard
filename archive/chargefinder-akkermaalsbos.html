<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laadpaal Akkermaalsbos 2, Wageningen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --card: #ffffff;
    --fg: #14181d;
    --muted: #67707c;
    --line: #e2e6ec;
    --ok: #0f8a4d;
    --busy: #c2560a;
    --unknown: #7a8290;
    --accent: #1f6feb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --card: #171b21; --fg: #e8ecf1; --muted: #98a2b0;
      --line: #262c34; --ok: #35c07a; --busy: #f0913f; --unknown: #8b95a3; --accent: #62a0ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px;
    background: var(--bg); color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; margin-bottom: 14px;
  }
  .row { display: flex; align-items: baseline; gap: 10px; padding: 6px 0; }
  .row + .row { border-top: 1px solid var(--line); }
  .k { color: var(--muted); flex: 0 0 40%; font-size: 13px; }
  .v { flex: 1; }
  .outlet { display: flex; align-items: center; gap: 12px; padding: 12px 0; }
  .outlet + .outlet { border-top: 1px solid var(--line); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; background: var(--unknown); }
  .dot.ok { background: var(--ok); }
  .dot.busy { background: var(--busy); }
  .oname { font-weight: 600; }
  .oid { color: var(--muted); font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .ometa { margin-left: auto; text-align: right; font-size: 13px; color: var(--muted); white-space: pre-line; }
  .badge {
    display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px;
    border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
  }
  .badge.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
  .badge.busy { color: var(--busy); border-color: color-mix(in srgb, var(--busy) 40%, transparent); }
  .bar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  button {
    font: inherit; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--card); color: var(--fg); cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  .stamp { color: var(--muted); font-size: 13px; }
  .err {
    background: color-mix(in srgb, var(--busy) 12%, var(--card));
    border-color: color-mix(in srgb, var(--busy) 35%, var(--line));
  }
  a { color: var(--accent); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title">Laadpaal Akkermaalsbos 2</h1>
  <p class="sub" id="subtitle">Loading…</p>

  <div class="bar">
    <button id="refresh">Refresh</button>
    <label class="stamp"><input type="checkbox" id="auto" checked> auto-refresh every 60&nbsp;s</label>
    <span class="stamp" id="stamp"></span>
  </div>

  <div id="error" class="card err" hidden></div>

  <div class="card">
    <h2>Connectors</h2>
    <div id="outlets"><span class="stamp">Loading…</span></div>
  </div>

  <div class="card">
    <h2>Station</h2>
    <div id="info"></div>
  </div>

  <p class="stamp">
    Data from ChargeFinder ·
    <a id="srclink" href="https://chargefinder.com/nl/laadpaal-wageningen-akkermaalsbos-2-wageningen/djx7rq" target="_blank" rel="noopener">source page</a>
  </p>
</div>

<script>
"use strict";

const SLUG = "djx7rq";
// The public API rejects requests whose Origin isn't chargefinder.com (403), so:
//   1. ?api=<base>            — explicit override
//   2. served over http(s)    — same-origin /api (chargefinder_proxy.py does this)
//   3. opened from disk       — direct call, which is refused; snapshot is shown
const API =
  new URLSearchParams(location.search).get("api") ||
  (location.protocol.startsWith("http") ? location.origin + "/api" : "https://api.chargefinder.com");

// Snapshot taken 2026-09-02, used when the live call is refused.
const SNAPSHOT = {
  station: {"slug":"djx7rq","title":"Akkermaalsbos 2, Wageningen","location":{"latitude":51.98232,"longitude":5.660022},"locationAddress":{"city":"Wageningen","country":"Netherlands","countryCode":"NL","street":"Akkermaalsbos 2","full":"Akkermaalsbos 2, Wageningen, Netherlands","zip":"6708 WB"},"operator":"","owner":"50five","access":"Public","reservation":"Public","realtime":1,"realtimeId":"kw2qpmhren2xy","freeCharging":0,"freeParking":0,"authCard":1,"openingHours":"24/7","minCapacity":7.4,"maxCapacity":22,"mapInfo":"50five 22kW","status":5,"tariffCount":3,"outletCount":5,
    "outletList":[
      {"capacity":22,"count":1,"current":32,"acdc":"AC","plug":"Type 2","voltage":230,"status":0,"outlets":[
        {"plug":"Type 2","identifier":"NL*505*E1234792938*1","name":"04000572","capacity":22,"current":32,"acdc":"AC","voltage":230,"status":0}]},
      {"capacity":7.4,"count":5,"current":32,"acdc":"AC","plug":"Type 2","voltage":230,"status":0,"outlets":[
        {"plug":"Type 2","identifier":"NL*505*E1234829462*1","name":"04000376","capacity":7.4,"current":32,"acdc":"AC","voltage":230,"status":0},
        {"plug":"Type 2","identifier":"NL*505*E1234792747*1","name":"04000391","capacity":7.4,"current":32,"acdc":"AC","voltage":230,"status":0},
        {"plug":"Type 2","identifier":"NL*505*E1234791607*1","name":"04000450","capacity":7.4,"current":32,"acdc":"AC","voltage":230,"status":0},
        {"plug":"Type 2","identifier":"NL*505*E1234766622*1","name":"04000523","capacity":7.4,"current":32,"acdc":"AC","voltage":230,"status":0},
        {"plug":"Type 2","identifier":"NL*505*E1234829427*1","name":"04000602","capacity":7.4,"current":32,"acdc":"AC","voltage":230,"status":0}]}
    ]},
  status: [
    {"id":"NL*505*E1234766622*1","status":2,"info":"Available since:\n16 min"},
    {"id":"NL*505*E1234791607*1","status":2,"info":"Available since:\n4 hours 29 min"},
    {"id":"NL*505*E1234792747*1","status":3,"info":"Charging since:\n5 hours 54 min"},
    {"id":"NL*505*E1234792938*1","status":3,"info":"Charging since:\n33 min"},
    {"id":"NL*505*E1234829427*1","status":0,"info":"Unknown since:\n> 2 days"},
    {"id":"NL*505*E1234829462*1","status":0,"info":"Unknown since:\n> 2 days"}
  ]
};
// Key used by the ChargeFinder web app to decrypt its API payloads (AES-GCM, then zlib).
const KEY_BYTES = new TextEncoder().encode("9ac6af64f912e44291c7989bb7da774a");

const STATUS_TEXT = {
  0: ["Unknown", ""],
  1: ["Out of service", "busy"],
  2: ["Available", "ok"],
  3: ["In use", "busy"],
  4: ["Reserved", "busy"],
  5: ["Unknown", ""],
};

function hexToBuf(hex) {
  return new Uint8Array(hex.match(/[\da-fA-F]{2}/g).map((h) => parseInt(h, 16))).buffer;
}

async function decryptPayload(payload) {
  if (!payload || !payload.e) return payload;
  const key = await crypto.subtle.importKey("raw", KEY_BYTES, "AES-GCM", true, ["decrypt"]);
  const plain = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: hexToBuf(payload.i) },
    key,
    hexToBuf(payload.e + payload.a)
  );
  const bytes = new Uint8Array(plain);
  // Payload is usually zlib-deflated JSON; occasionally plain JSON.
  if (bytes[0] === 0x78) {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
    return JSON.parse(await new Response(stream).text());
  }
  return JSON.parse(new TextDecoder().decode(bytes));
}

async function apiGet(path) {
  const res = await fetch(API + path, { cache: "no-store" });
  if (!res.ok) throw new Error("HTTP " + res.status + " for " + path);
  return decryptPayload(await res.json());
}

function flatOutlets(station) {
  const list = [];
  for (const group of station.outletList || []) {
    for (const o of group.outlets || []) list.push(o);
  }
  return list;
}

function renderStation(station) {
  document.title = station.title + " — ChargeFinder";
  document.getElementById("title").textContent = station.title;
  const addr = station.locationAddress || {};
  document.getElementById("subtitle").textContent =
    [addr.zip, addr.city, station.owner && "· " + station.owner].filter(Boolean).join(" ");

  const kw = station.minCapacity === station.maxCapacity
    ? station.maxCapacity + " kW"
    : station.minCapacity + "–" + station.maxCapacity + " kW";
  const rows = [
    ["Operator", station.owner || station.operator || "—"],
    ["Address", addr.full || "—"],
    ["Power", kw],
    ["Connectors", (station.outletList || [])
      .map((g) => g.outlets.length + " × " + g.plug + " " + g.capacity + " kW")
      .join(", ") || "—"],
    ["Access", station.access + (station.authCard ? " · charge card required" : "")],
    ["Opening hours", station.openingHours || "—"],
    ["Free charging", station.freeCharging ? "Yes" : "No"],
    ["Coordinates", station.location.latitude.toFixed(5) + ", " + station.location.longitude.toFixed(5)],
  ];
  document.getElementById("info").innerHTML = rows
    .map((r) => `<div class="row"><div class="k">${r[0]}</div><div class="v">${escapeHtml(String(r[1]))}</div></div>`)
    .join("");
}

function renderOutlets(station, statusList) {
  const byId = new Map((statusList || []).map((s) => [s.id, s]));
  const html = flatOutlets(station)
    .map((o) => {
      const live = byId.get(o.identifier);
      const code = live ? live.status : o.status;
      const [label, cls] = STATUS_TEXT[code] || ["Status " + code, ""];
      const since = live && live.info ? live.info.replace(/^[^:]*:\s*/, "") : "";
      return `
        <div class="outlet">
          <span class="dot ${cls}"></span>
          <div>
            <div class="oname">${escapeHtml(o.name || o.identifier)}</div>
            <div class="oid">${escapeHtml(o.identifier)}</div>
          </div>
          <div class="ometa">
            <span class="badge ${cls}">${escapeHtml(label)}</span><br>
            ${escapeHtml(o.capacity + " kW · " + o.plug)}${since ? "\n" + escapeHtml(since) : ""}
          </div>
        </div>`;
    })
    .join("");
  document.getElementById("outlets").innerHTML = html || '<span class="stamp">No connectors listed.</span>';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function showError(msg) {
  const el = document.getElementById("error");
  el.hidden = false;
  el.innerHTML =
    "<strong>Live data unavailable — showing the snapshot below.</strong><br>" +
    escapeHtml(msg) +
    "<br><br>The ChargeFinder API answers <code>403 Forbidden</code> unless the request comes from " +
    "<code>chargefinder.com</code> itself, so a page opened from disk cannot reach it. For live status run " +
    "<code>uv run chargefinder_proxy.py</code> and open <code>http://localhost:8787/</code> instead.";
}

let station = null;

async function load() {
  let live = true;
  try {
    if (!station || station.__snapshot) {
      station = await apiGet("/station/" + SLUG);
    }
    let statusList = [];
    if (station.realtime && station.realtimeId) {
      statusList = await apiGet("/status/" + station.realtimeId);
    }
    renderStation(station);
    renderOutlets(station, statusList);
    document.getElementById("error").hidden = true;
  } catch (err) {
    live = false;
    showError(err && err.message ? err.message : String(err));
    station = Object.assign({ __snapshot: true }, SNAPSHOT.station);
    renderStation(station);
    renderOutlets(station, SNAPSHOT.status);
  }
  document.getElementById("stamp").textContent = live
    ? "live · updated " + new Date().toLocaleTimeString("nl-NL", { hour: "2-digit", minute: "2-digit", second: "2-digit" })
    : "snapshot of 2 Sep 2026";
}

let timer = null;
function setAuto(on) {
  clearInterval(timer);
  if (on) timer = setInterval(load, 60000);
}

document.getElementById("refresh").addEventListener("click", load);
document.getElementById("auto").addEventListener("change", (e) => setAuto(e.target.checked));
setAuto(true);
load();
</script>
</body>
</html>
